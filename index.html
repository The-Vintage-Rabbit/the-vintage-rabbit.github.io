const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function bestPrice(n, unit, deals) {
  const dp = [0];
  for (let i = 1; i <= n; i++) { let b = dp[i - 1] + unit; deals.forEach(d => { if (i >= d.n) b = Math.min(b, dp[i - d.n] + d.price); }); dp[i] = b; }
  return dp[n];
}

function lines() {
  return Object.keys(s.cart).filter(k => s.cart[k] > 0 && BY_ID[k.split('-')[0]]).map(k => {
    const [id, oi, vi] = k.split('-');
    const p = BY_ID[id], o = p.opts[+oi] || p.opts[0], v = p.vars ? p.vars[+vi] : '';
    const bits = []; if (p.opts.length > 1) bits.push(o.label); if (v) bits.push(v);
    return { k, p, qty: s.cart[k], price: o.price, bits, full: p.name + (bits.length ? ' (' + bits.join(', ') + ')' : '') };
  });
}

function totals() {
  const L = lines();
  const count = L.reduce((a, l) => a + l.qty, 0);
  const gross = L.reduce((a, l) => a + l.qty * l.price, 0);
  const promos = [];
  Object.keys(DEALS).forEach(dk => {
    const d = DEALS[dk], n = L.filter(l => l.p.deal === dk).reduce((a, l) => a + l.qty, 0);
    if (n >= 2) { const save = n * d.unit - bestPrice(n, d.unit, d.deals); if (save > 0.001) promos.push({ label: d.label, amt: save }); }
  });
  const subtotal = gross - promos.reduce((a, p) => a + p.amt, 0);
  const yalo = s.metodo === 'yalo', carrier = s.metodo === 'zoom' ? 'Zoom' : 'MRW';
  const band = bands().find(b => b.id === s.banda);
  let fee = 0, feeTxt, envio;
  if (yalo) { fee = band && !band.quote ? band.price : 0; feeTxt = fee > 0 ? usd(fee) : 'Por confirmar'; envio = 'Yalo' + (band ? ' (' + band.label.split(' · ')[0] + ')' : ''); }
  else { feeTxt = 'Cobro a destino'; envio = carrier; }
  const total = subtotal + fee;
  const totalLabel = yalo && fee === 0 ? 'Total (sin envío)' : 'Total';
  const f = s.f;
  const destino = yalo ? (f.direccion + (f.referencia ? ' (Ref: ' + f.referencia + ')' : '') + ', Caracas')
    : ('Oficina ' + carrier + ' ' + f.agencia + ', ' + f.ciudad + ', ' + f.estado);
  return { L, count, gross, promos, subtotal, fee, feeTxt, envio, total, totalLabel, destino, yalo, carrier };
}

function deliveryOk() {
  const f = s.f; let ok = filled(f.nombre) && filled(f.telefono);
  if (s.metodo === 'yalo') ok = ok && !!s.banda && filled(f.direccion);
  else ok = ok && filled(f.cedula) && filled(f.estado) && filled(f.ciudad) && filled(f.agencia);
  return ok;
}

function renderCard(p) {
  const so = soldOut(p);
  const prices = p.consult ? [] : p.opts.map(o => o.price);
  const min = prices.length ? Math.min(...prices) : 0;
  const varied = prices.length > 1 && Math.max(...prices) !== min;
  let ph;
  if (p.img && p.rect) ph = '<img class="rect" src="' + IMG(p.img) + '" alt="' + esc(p.name) + '" loading="lazy">';
  else if (p.img) ph = '<img class="round" src="' + IMG(p.img) + '" alt="' + esc(p.name) + '" loading="lazy">';
  else ph = '<div class="mark"><img src="' + LOGO + '" alt=""></div>';
  let action;
  if (p.consult) action = '<a class="btn-o" href="' + esc(wa('¡Hola, The Vintage Rabbit Co.! Quiero consultar por: ' + p.name)) + '" target="_blank" rel="noopener">Consultar</a>';
  else if (so) action = '<button class="btn" disabled>Agotado</button>';
  else if (isSimple(p)) {
    const k = sku(p, 0, 0), q = s.cart[k] || 0;
    action = q > 0
      ? '<div class="stepper"><button data-act="dec" data-k="' + k + '" aria-label="Quitar uno">−</button><span>' + q + '</span><button data-act="inc" data-k="' + k + '" aria-label="Agregar uno"' + (left(k) <= 0 ? ' disabled' : '') + '>+</button></div>'
      : '<button class="btn" data-act="inc" data-k="' + k + '">Agregar</button>';
  } else action = '<button class="btn" data-act="open" data-id="' + p.id + '">Elegir opciones</button>';
  const priceTxt = p.consult ? p.priceLabel : (varied ? 'desde ' + usd(min) : usd(min));
  return '<article class="card' + (so ? ' soldout' : '') + '"><div class="ph">' + (so ? '<span class="so-tag">Agotado</span>' : '') + ph + '</div><div class="cb">' +
    '<div class="tag">' + esc(p.tag) + '</div><div class="name">' + esc(p.name) + '</div><div class="sub">' + esc(p.sub) + '</div>' +
    '<div class="price"><b>' + priceTxt + '</b>' + (showBs() && !p.consult ? '<small>' + bs(min) + '</small>' : '') + '</div>' + action + '</div></article>';
}

  let h = '<section class="sec"><div class="grp"><h2>Tus datos</h2>' +
    field('nombre', 'Nombre y apellido *', 'type="text" autocomplete="name" placeholder="Ej. María Pérez"') +

    '<div class="grp"><h2>¿Cómo recibes tu pedido?</h2>' + M.map(m => '<button class="opt' + (s.metodo === m.id ? ' on' : '') + '" data-act="metodo" data-id="' + m.id + '" aria-pressed="' + (s.metodo === m.id) + '"><span class="dot"></span><span><b>' + m.label + '</b><small>' + m.sub + '</small></span></button>').join('') + '</div>';
  if (t.yalo) {

      '<button class="geo" data-act="geo">' + ICON.pin + 'Calcular con mi ubicación</button>' + (s.geoMsg ? '<div class="hint" style="color:var(--muted2)">' + esc(s.geoMsg) + '</div>' : '') +
      '<div class="bands">' + bands().map(b => '<button class="band' + (s.banda === b.id ? ' on' : '') + (b.wide ? ' wide' : '') + '" data-act="band" data-id="' + b.id + '" aria-pressed="' + (s.banda === b.id) + '"><b style="font-weight:' + (s.banda === b.id ? 600 : 500) + '">' + b.label + '</b><small>' + (b.quote ? 'Te confirmamos' : usd(b.price)) + '</small></button>').join('') + '</div>' +
      field('direccion', 'Dirección completa *', 'type="text" autocomplete="street-address" placeholder="Urbanización, calle, edificio/casa, piso, apto."') +
      field('referencia', 'Punto de referencia', 'type="text" placeholder="Ej. frente a la panadería"') + '</div>';
  } else {
    h += '<div class="grp"><h2>Envío por ' + t.carrier + '</h2><div class="hint">Cobro a destino: pagas el envío directamente en la oficina de ' + t.carrier + ' al retirar. Lleva tu cédula.</div>' +
      field('cedula', 'Cédula de identidad *', 'type="text" placeholder="V-12345678"') +
      '<label class="f">Estado *<select data-f="estado"><option value="">Selecciona tu estado</option>' + ESTADOS_VE.map(e => '<option' + (s.f.estado === e ? ' selected' : '') + '>' + e + '</option>').join('') + '</select></label>' +
      field('ciudad', 'Ciudad *', 'type="text" autocomplete="address-level2" placeholder="Ej. Valencia"') +
      field('agencia', 'Oficina ' + t.carrier + ' de destino *', 'type="text" placeholder="Nombre o dirección de la oficina"') + '</div>';
  }
  h += field('notas', 'Notas del pedido (opcional)', 'type="text" placeholder="Aromas preferidos, mensaje de regalo…"') + '</section>';
  return h;
}

    case 'pagomovil': return '<div class="paybox"><div class="k">Pago Móvil</div><div>Banco: Banesco</div><div>Teléfono: 0424 165 6456</div><div>Cédula: E-84577902</div><div class="m">Monto a transferir: <b>' + (showBs() ? bs(t.total) : usd(t.total) + ' a la tasa del día') + '</b></div>' + copyBtn('pm', 'Copiar datos') + '</div>';
    case 'paypal': return '<div class="paybox"><div class="k">PayPal</div><div style="font-size:15px">@marvinschultz19</div><div class="m" style="word-break:break-all">o al correo marvinschultz1@gmail.com</div><div class="m">Monto a enviar: <b>' + usd(t.total) + '</b></div>' + copyBtn('paypal', 'Copiar usuario') + '</div>';

function renderPay(t) {
  const P = [{ id: 'zelle', label: 'Zelle' }, { id: 'pagomovil', label: 'Pago Móvil' }, { id: 'paypal', label: 'PayPal' }];

    '<div class="grp"><h2>Método de pago</h2><div class="pays">' + P.map(p => '<button class="pay' + (s.pago === p.id ? ' on' : '') + '" data-act="pago" data-id="' + p.id + '" aria-pressed="' + (s.pago === p.id) + '">' + p.label + '</button>').join('') + '</div>' +
    (!t.yalo ? '<div class="hint">Pago en efectivo disponible solo para entregas en Caracas.</div>' : '') + '</div>' + payBox(t) +
    '<div class="box"><h2 style="font-size:20px">Resumen del pedido</h2>' +
    t.L.map(l => '<div class="row" style="font-size:13px"><span>' + l.qty + ' × ' + esc(l.full) + '</span><span>' + usd(l.qty * l.price) + '</span></div>').join('') +
    renderSummaryRows(t) + '<div class="hr"></div>' +
    '<div class="row"><span>Subtotal</span><span>' + usd(t.subtotal) + '</span></div>' +
    '<div class="row"><span>Envío · ' + esc(t.envio) + '</span><span>' + t.feeTxt + '</span></div>' +
    '<div class="row big"><span>' + t.totalLabel + '</span><span>' + usd(t.total) + '</span></div>' +

    '<div class="hint" style="font-size:13px;color:var(--muted2)">Al tocar el botón se abre WhatsApp con tu pedido listo. Envíalo y adjunta la captura de tu pago para confirmarlo.</div></section>';
}

function renderDone() {
  return '<section class="done"><div class="mk"><img src="' + LOGO + '" alt=""></div><h2>¡Gracias por tu pedido!</h2><p>Pedido <b>' + esc(s.orden) + '</b></p>' +
    '<p>Envía el mensaje en WhatsApp con la captura de tu pago. Te confirmamos y coordinamos la entrega.</p>' +
    '<a class="btn-o" style="width:auto;padding:0 24px;height:48px;border-radius:24px" href="' + esc(s.waLink) + '">Abrir WhatsApp de nuevo</a>' +
    '<button class="link" style="font-size:14px;color:var(--muted2)" data-act="new">Volver a la tienda</button></section>';
}

function renderBar(t) {
  if (s.sheet) return '';
  if (s.screen === 'shop' && t.count) return '<div class="bar float"><button class="cta split" data-act="go" data-to="cart"><span>Ver carrito (' + t.count + ')</span><span>' + usd(t.subtotal) + '</span></button></div>';
  if (s.screen === 'cart' && t.count) return '<div class="bar"><button class="cta" data-act="go" data-to="delivery">Continuar a la entrega</button></div>';
  if (s.screen === 'delivery') return '<div class="bar"><div class="note" id="dnote"' + (deliveryOk() ? ' hidden' : '') + '>Completa los campos marcados con *</div><button class="cta" id="dcta" data-act="go" data-to="pay"' + (deliveryOk() ? '' : ' disabled') + '>Continuar al pago</button></div>';
  if (s.screen === 'pay') return '<div class="bar">' + (s.pago ? '' : '<div class="note">Elige un método de pago</div>') +
    '<button class="cta wa" data-act="send"' + (s.pago && !s.sending ? '' : ' disabled') + '>' + ICON.wa + (s.sending ? 'Enviando pedido…' : 'Enviar pedido por WhatsApp') + '</button></div>';
  return '';
}

function renderSheet() {
  const p = BY_ID[s.sheet.id]; if (!p) return '';
  const sh = s.sheet;
  const o = p.opts[sh.oi];
  const vi = p.vars ? sh.vi : 0;
  const k = (p.vars && vi < 0) ? null : sku(p, sh.oi, vi);
  const avail = k ? left(k) : Infinity;
  const blocked = !k || avail <= 0;
  const optAvail = oi => (p.vars || ['']).some((v, j) => left(sku(p, oi, j)) > 0);
  let h = '<div class="sheet-wrap"><button class="scrim" data-act="close" aria-label="Cerrar"></button><div class="sheet" role="dialog" aria-label="' + esc(p.name) + '">' +
    '<div class="sh-head">' + thumb(p, 'th') + '<div style="flex:1;display:flex;flex-direction:column;gap:3px"><div class="tag">' + esc(p.tag) + '</div><div class="name">' + esc(p.name) + '</div></div><button class="x" data-act="close" aria-label="Cerrar">' + ICON.x + '</button></div>' +
    '<div style="font-size:14px;color:var(--muted2);line-height:1.5">' + esc(p.desc) + '</div>';
  if (p.opts.length > 1) h += '<div class="grp" style="gap:8px"><div class="tag" style="font-size:11px">' + esc(p.optName) + '</div><div class="pills">' +
    p.opts.map((op, i) => '<button class="pill' + (sh.oi === i ? ' on' : '') + '" data-act="soi" data-i="' + i + '"' + (optAvail(i) ? '' : ' disabled') + '>' + esc(op.label) + ' · ' + usd(op.price) + '</button>').join('') + '</div></div>';
  if (p.vars) h += '<div class="grp" style="gap:8px"><div class="tag" style="font-size:11px">' + esc(p.varName) + '</div><div class="pills">' +
    p.vars.map((v, j) => '<button class="pill' + (sh.vi === j ? ' on' : '') + '" data-act="svi" data-i="' + j + '"' + (left(sku(p, sh.oi, j)) > 0 ? '' : ' disabled') + '>' + esc(v) + '</button>').join('') + '</div></div>';
  if (k && isFinite(stockOf(k)) && avail > 0 && avail <= 5) h += '<div class="left">¡Quedan ' + avail + '!</div>';
  if (k && avail <= 0) h += '<div class="left">Esta opción está agotada.</div>';
  h += '<div class="addrow"><div class="qbox"><button data-act="sq" data-d="-1" aria-label="Menos">−</button><span>' + sh.qty + '</span><button data-act="sq" data-d="1" aria-label="Más"' + (sh.qty >= avail ? ' disabled' : '') + '>+</button></div>' +
    '<button class="cta" data-act="add"' + (blocked ? ' disabled' : '') + '>Agregar · ' + usd(o.price * sh.qty) + '</button></div>';
  if (!k) h += '<div class="note" style="font-size:12px;color:var(--muted);text-align:center">Elige ' + esc(p.varName.toLowerCase()) + ' para continuar</div>';
  return h + '</div></div>';
}

let lastScreen = '';
function render() {
  const app = document.getElementById('app');
  const main = app.querySelector('main');
  const keep = main && lastScreen === s.screen ? main.scrollTop : 0;
  const t = totals();
  let body = '';
  if (s.screen === 'shop') body = renderShop();
  else if (s.screen === 'cart') body = renderCart(t);
  else if (s.screen === 'delivery') body = renderDelivery(t);
  else if (s.screen === 'pay') body = renderPay(t);
  else body = renderDone();
  app.innerHTML = renderHeader(t) + renderSteps() + '<main>' + body + '</main>' + renderBar(t) + (s.sheet ? renderSheet() : '');
  app.querySelector('main').scrollTop = keep;
  lastScreen = s.screen;
}

// ====== ACCIONES ======
function setQty(k, q) {
  q = Math.max(0, Math.min(q, stockOf(k)));
  if (q <= 0) delete s.cart[k]; else s.cart[k] = q;
  save();
}
function go(screen) { s.err = ''; s.screen = screen; if (screen !== 'shop') s.sheet = null; }

function useGeo() {
  if (!navigator.geolocation) { s.geoMsg = 'Tu navegador no permite ubicación. Elige la distancia abajo.'; render(); return; }
  s.geoMsg = 'Buscando tu ubicación…'; render();
  navigator.geolocation.getCurrentPosition(pos => {
    const R = 6371, r = d => d * Math.PI / 180;
    const dLat = r(pos.coords.latitude - SHOP.lat), dLng = r(pos.coords.longitude - SHOP.lng);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(r(SHOP.lat)) * Math.cos(r(pos.coords.latitude)) * Math.sin(dLng / 2) ** 2;
    const km = 2 * R * Math.asin(Math.sqrt(a));
    const b = bands().find(x => km <= x.max);
    s.banda = b.id;
    s.geoMsg = 'Estás a unos ' + km.toFixed(1).replace('.', ',') + ' km en línea recta. Seleccionamos tu tarifa; Yalo puede ajustarla según la ruta.';
    render();
  }, () => { s.geoMsg = 'No pudimos obtener tu ubicación. Elige la distancia abajo.'; render(); }, { enableHighAccuracy: true, timeout: 12000 });
}

function copy(key) {
  const txt = { zelle: 'marvinschultz1@gmail.com', pm: 'Banesco 04241656456 E-84577902', paypal: '@marvinschultz19' }[key];
  const done = () => { s.copied = key; render(); setTimeout(() => { if (s.copied === key) { s.copied = ''; render(); } }, 1800); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(txt).then(done, () => { fallbackCopy(txt); done(); });
    else { fallbackCopy(txt); done(); }
  } catch (e) { fallbackCopy(txt); done(); }
}
function fallbackCopy(txt) {
  try { const ta = document.createElement('textarea'); ta.value = txt; ta.style.position = 'fixed'; ta.style.opacity = '0'; document.body.appendChild(ta); ta.select(); document.execCommand('copy'); ta.remove(); } catch (e) {}
}

async function sendOrder() {
  if (s.sending || !s.pago) return;
  const t = totals();
  if (!t.count) return;
  s.sending = true; s.err = ''; render();
  let orden = '';
  if (API && API.indexOf('http') === 0) {
    const payload = {
      nombre: s.f.nombre, telefono: s.f.telefono, cedula: t.yalo ? '' : s.f.cedula,
      entrega: t.yalo ? 'Delivery Yalo (Caracas)' : 'Envío ' + t.carrier, destino: t.destino, notas: s.f.notas,
      pago: PAGO_LABEL[s.pago], envioTxt: t.envio + ' — ' + t.feeTxt,
      subtotal: Math.round(t.subtotal * 100) / 100, total: Math.round(t.total * 100) / 100, totalBs: showBs() ? bs(t.total) : '',
      promosTxt: t.promos.map(p => p.label + ': −' + usd(p.amt)).join(' · '),
      items: t.L.map(l => ({ sku: l.k, nombre: l.full, qty: l.qty, precio: l.price }))
    };
    try {
      const ctrl = new AbortController(); const timer = setTimeout(() => ctrl.abort(), 15000);
      const res = await fetch(API, { method: 'POST', body: JSON.stringify(payload), signal: ctrl.signal });
      clearTimeout(timer);
      const j = await res.json();
      if (j.ok) orden = j.orden;
      else if (j.agotados) {
        s.stock = j.stock || s.stock;
        Object.keys(s.cart).forEach(k => setQty(k, s.cart[k]));
        s.err = 'Lo sentimos: algunos productos se agotaron mientras comprabas. Ajustamos tu carrito a lo disponible; revísalo antes de continuar.';
        s.sending = false; s.screen = 'cart'; render(); return;
      }
    } catch (e) { /* sin conexión con la hoja: el pedido igual llega por WhatsApp */ }
  }
  if (!orden) orden = 'VR-W' + String(Date.now()).slice(-5);
  const link = wa(waMessage(orden, t));
  s.orden = orden; s.waLink = link; s.sending = false; s.screen = 'done'; s.cart = {}; s.pago = ''; save(); render();
  window.location.href = link;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.disabled) return;
  const a = el.dataset.act, d = el.dataset;
  switch (a) {
    case 'cat': {
      s.cat = d.id; render();
      const m = document.querySelector('main'), hero = document.querySelector('.hero');
      if (hero && m.scrollTop > hero.offsetHeight) m.scrollTop = hero.offsetHeight;
      return;
    }
    case 'go': if (d.to === 'pay' && !deliveryOk()) return; go(d.to); break;
    case 'back': go({ cart: 'shop', delivery: 'cart', pay: 'delivery', done: 'shop' }[s.screen] || 'shop'); break;
    case 'inc': setQty(d.k, (s.cart[d.k] || 0) + 1); break;
    case 'dec': setQty(d.k, (s.cart[d.k] || 0) - 1); break;
    case 'rm': setQty(d.k, 0); break;
    case 'open': {
      const p = BY_ID[d.id]; let oi = p.opts.findIndex((o, i) => (p.vars || ['']).some((v, j) => left(sku(p, i, j)) > 0));
      s.sheet = { id: d.id, oi: Math.max(0, oi), vi: -1, qty: 1 };
      if (!p.vars) s.sheet.vi = 0; break;
    }
    case 'close': s.sheet = null; break;
    case 'soi': s.sheet.oi = +d.i; s.sheet.qty = 1; break;
    case 'svi': s.sheet.vi = +d.i; s.sheet.qty = 1; break;
    case 'sq': s.sheet.qty = Math.max(1, s.sheet.qty + (+d.d)); break;
    case 'add': {
      const p = BY_ID[s.sheet.id], k = sku(p, s.sheet.oi, p.vars ? s.sheet.vi : 0);
      setQty(k, (s.cart[k] || 0) + s.sheet.qty); s.sheet = null; break;
    }
    case 'metodo': s.metodo = d.id; if (d.id !== 'yalo' && s.pago === 'efectivo') s.pago = ''; break;
    case 'band': s.banda = d.id; break;
    case 'geo': useGeo(); return;
    case 'pago': s.pago = d.id; break;
    case 'copy': copy(d.key); return;
    case 'send': sendOrder(); return;
    case 'new': s.screen = 'shop'; s.orden = ''; s.banda = ''; break;
  }
  render();
});

// Form fields update state without re-rendering, so typing and focus are never interrupted.
function onField(e) {
  const k = e.target.dataset && e.target.dataset.f; if (!k) return;
  s.f[k] = e.target.value; save();
  const ok = deliveryOk(), btn = document.getElementById('dcta'), note = document.getElementById('dnote');
  if (btn) btn.disabled = !ok; if (note) note.hidden = ok;
}
document.addEventListener('input', onField);
document.addEventListener('change', onField);

// ====== CARGA DE INVENTARIO Y AJUSTES ======
async function loadConfig() {
  if (!API || API.indexOf('http') !== 0) return;
  try {
    const res = await fetch(API + '?t=' + Date.now());
    const j = await res.json();
    if (!j.ok) return;
    s.stock = j.stock || {};
    ['tasa', 'yaloBase', 'yalo36', 'yalo614', 'yaloCada4'].forEach(k => { if (typeof j[k] === 'number' && !isNaN(j[k])) s.cfg[k] = j[k]; });
    if (j.tasaFecha) s.cfg.tasaFecha = j.tasaFecha;
    Object.keys(s.cart).forEach(k => setQty(k, s.cart[k]));
    render();
  } catch (e) { /* la tienda funciona igual sin la hoja */ }
}

render();
loadConfig();
